
[module/nixbtw-fly]
inherit = module/nixbtw
click-left = ~/.config/polybar/scripts/fly-toggle.sh

[module/temperature]
type = internal/temperature
interval = 0.5
hwmon-path = /sys/devices/platform/coretemp.0/hwmon/hwmon1/temp1_input
label = %{T3}%{T1} %temperature-c%
label-warn = %{T3}%{T1} %temperature-c%
label-warn-foreground = ${colors.l-red}


[module/nixbtw]
type = custom/text
label = ""
label-font = 6
label-foreground = ${colors.l-blue}


[module/bluetooth-battery]
type = custom/script
exec = ~/.config/polybar/scripts/batteryremaining.sh
interval = 30
label = %output%
format-background = ${colors.black}
format-foreground = ${colors.l-white}

[module/proton-status]
type = custom/script
exec = ~/.config/polybar/scripts/proton-status.sh
interval = 30
label = %output%
label-font = 2
format-background = ${colors.black}
format-foreground = ${colors.l-white}
click-left = ~/.config/polybar/scripts/toggle-proton.sh


[module/date]
type = internal/date
date = %{A1: gsimplecal &:}%{A3: ghostty --command='tty-clock -C 5 -s -c' &:}%d %b %Y %H:%M:%S%{A}%{A}
# label-underline = ${colors.l-magenta}

[module/tray]
type = internal/tray

[module/memory]
type = internal/memory
interval = 0.5
format = <label>
label = %{T2}%{T1} %used% (%swap_used%)

[module/cpu]
type = internal/cpu
interval = 0.5
label = %{T2}%{T1} %percentage%%

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 15
fixed-values = true
spacing = 4
label-mounted = %{T3}󰋊%{T1} %mountpoint% %used%
label-unmounted = %mountpoint% unmounted
label-unmounted-foreground = ${colors.white}


[module/battery]
type = internal/battery
ramp-capacity-0 = 󰂃
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂

ramp-capacity-0-font = 2
ramp-capacity-1-font = 2
ramp-capacity-2-font = 2
ramp-capacity-3-font = 2
ramp-capacity-4-font = 2
ramp-capacity-5-font = 2
ramp-capacity-6-font = 2
ramp-capacity-7-font = 2
ramp-capacity-8-font = 2
ramp-capacity-9-font = 2

format-charging = <ramp-capacity> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = 󰁹 <label-full>

[module/xwindow]
type = internal/xwindow
format = <label>
format-background = ${colors.black}
format-foreground = ${colors.l-white}
format-padding = 2
label = %title%
label-maxlen = 15
label-empty = Desktop
label-empty-foreground = ${colors.white}

[module/bspwm]
type = internal/bspwm
pin-workspaces = false
enable-click = true
label-focused = "%{T4} %{T1}%name%%{T4} %{T1}"
label-focused-background = ${colors.magenta}
label-focused-foreground = ${colors.l-blue}
label-focused-underline = ${colors.l-magenta}

label-occupied = "%{T4} %{T1}%name%%{T4} %{T1}"

label-dimmed = "%{T4} %{T1}%name%%{T4} %{T1}"
label-dimmed-foreground = ${colors.white}


label-urgent = "%{T4} %{T1}%name%%{T4} %{T1}"
label-urgent-background = ${colors.red}

label-empty = "%{T4} %{T1}%name%%{T4} %{T1}"
label-empty-foreground = ${colors.l-green}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
ramp-volume-0 = %{T2}󰕿%{T1}
ramp-volume-1 = %{T2}󰖀%{T1} 
ramp-volume-2 = %{T2}󰕾%{T1}
format-volume = <ramp-volume> <label-volume>
label-muted = %{T2}%{T1} muted
format-volume-underline = ${colors.l-magenta}
click-right = pavucontrol
