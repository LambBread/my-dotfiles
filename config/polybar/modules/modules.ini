[colors]
primary = #90245b97
primary-darkened = #90205083
secondary = #bc9ed0
tertiary = #f08533
fourth = #cfb793
fifth = #9fd356
white = #ECE3D5

[bar/fly]
background = ${colors.primary}
foreground = ${colors.white}
font-0 = "MonaspiceAr Nerd Font Mono:size=11:weight=bold"
font-1 = "MonaspiceAr Nerd Font Mono:size=18:weight=bold;3"
font-2 = "MonaspiceAr Nerd Font Mono:size=14:weight=bold;2"
font-3 = "MonaspiceAr Nerd Font Mono:size=6"
font-4 = "Noto Color Emoji:size=18:scale=8;2"
font-5 = "MonaspiceAr Nerd Font Mono:size=24:weight=bold;5"
modules-center = xwindow date time bluetooth-battery pulseaudio
underline-size = 2
padding = 2
height = 32
width = 600
module-margin-left = 2
module-margin-right = 0
radius = 20
offset-y = 48
offset-x = 10
override-redirect = true

[module/nixbtw-fly]
inherit = module/nixbtw
click-left = ~/.config/polybar/scripts/fly-toggle.sh

[module/temperature]
type = internal/temperature
interval = 0.5
hwmon-path = /sys/devices/platform/coretemp.0/hwmon/hwmon1/temp1_input
label = %{T3}%{T1} %temperature-c%
label-warn = %{T3}%{T1} %temperature-c%
label-warn-foreground = ${colors.tertiary}

[module/weather]
type = custom/script
exec = curl -s "wttr.in/Prince+George?format=%20%c%t&m"
interval = 120
exec-if = ping -c 1 wttr.in
click-left = xdg-open "https://www.theweathernetwork.com/en/city/ca/british-columbia/prince-george/current"
label-underline = ${colors.secondary}

[module/nixbtw]
type = custom/text
label = ""
label-font = 6
label-foreground = #6ba1db


[module/bluetooth-battery]
type = custom/script
exec = ~/.config/polybar/scripts/batteryremaining.sh
interval = 10
label = %output%
format-background = ${colors.primary}
format-foreground = ${colors.white}

[module/proton-status]
type = custom/script
exec = ~/.config/polybar/scripts/proton-status.sh
interval = 7
label = %output%
label-font = 2
format-background = ${colors.primary}
format-foreground = ${colors.white}
click-left = ~/.config/polybar/scripts/toggle-proton.sh


[module/date]
type = internal/date
date = %{A1: gsimplecal &:}%{T2}%{T1} %Y-%m-%d%{A}
label-underline = ${colors.secondary}
# click-left = gsimplecal

[module/time]
type = internal/date
date = %{A1: ghostty --command='tty-clock -C 5 -s -c' &:}%{T3}%{T1} %H:%M:%S%{A}
label-underline = ${colors.secondary}
# click-left = ghostty --command='tty-clock -C 5 -s -c'

[module/tray]
type = internal/tray

[module/memory]
type = internal/memory
interval = 3
format = <label>
label = %{T2}%{T1} %used%/%total%

[module/battery]
type = internal/battery
ramp-capacity-0 = 󰂃
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂

ramp-capacity-0-font = 2
ramp-capacity-1-font = 2
ramp-capacity-2-font = 2
ramp-capacity-3-font = 2
ramp-capacity-4-font = 2
ramp-capacity-5-font = 2
ramp-capacity-6-font = 2
ramp-capacity-7-font = 2
ramp-capacity-8-font = 2
ramp-capacity-9-font = 2

format-charging = <ramp-capacity> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = 󰁹 <label-full>

[module/xwindow]
type = internal/xwindow
format = <label>
format-background = ${colors.primary}
format-foreground = ${colors.white}
format-padding = 2
label = %title%
label-underline = ${colors.secondary}
label-maxlen = 15
label-empty = Desktop
label-empty-foreground = ${colors.fourth}

[module/bspwm]
type = internal/bspwm
pin-workspaces = false
enable-click = true
label-focused = "%{T4} %{T1}%name%%{T4} %{T1}"
label-focused-background = ${colors.primary-darkened}
label-focused-foreground = ${colors.secondary}
label-focused-underline = ${colors.secondary}

label-occupied = "%{T4} %{T1}%name%%{T4} %{T1}"

label-dimmed = "%{T4} %{T1}%name%%{T4} %{T1}"
label-dimmed-foreground = ${colors.fourth}


label-urgent = "%{T4} %{T1}%name%%{T4} %{T1}"
label-urgent-background = ${colors.tertiary}

label-empty = "%{T4} %{T1}%name%%{T4} %{T1}"
label-empty-foreground = ${colors.fifth}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
ramp-volume-0 = %{T2}󰕿%{T1}
ramp-volume-1 = %{T2}󰖀%{T1} 
ramp-volume-2 = %{T2}󰕾%{T1}
format-volume = <ramp-volume> <label-volume>
label-muted = %{T2}%{T1} muted
format-volume-underline = ${colors.secondary}
click-right = pavucontrol

bar-volume-width = 10
bar-volume-foreground-0 = ${colors.secondary}
bar-volume-foreground-1 = ${colors.secondary}
bar-volume-foreground-2 = ${colors.fifth}
bar-volume-foreground-3 = ${colors.fifth}
bar-volume-foreground-4 = ${colors.tertiary}
bar-volume-gradient = true
bar-volume-indicator = ┃
bar-volume-fill = ━
bar-volume-fill-font = 1
bar-volume-empty = -
bar-volume-empty-font = 1
bar-volume-empty-foreground = ${colors.fourth}
