include-file = ~/.config/polybar/modules/modules.ini

[bar/top]
background = ${colors.primary}
foreground = ${colors.white}
font-0 = "MonaspiceAr Nerd Font Mono:size=11:weight=bold"
font-1 = "MonaspiceAr Nerd Font Mono:size=18:weight=bold;3"
font-2 = "MonaspiceAr Nerd Font Mono:size=14:weight=bold;2"
font-3 = "MonaspiceAr Nerd Font Mono:size=6"
font-4 = "Noto Color Emoji:size=18:scale=8;2"
font-5 = "MonaspiceAr Nerd Font Mono:size=24:weight=bold;5"
modules-right = battery weather memory
modules-left = nixbtw-fly tray
modules-center = bspwm
underline-size = 2
padding = 2
height = 32
width = 1342
module-margin-left = 2
module-margin-right = 0
radius = 20
offset-y = 12
offset-x = 12

[module/network]
type = internal/network
interface-type = wireless
interval = 10.0
ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
format-connected = %{T3}<ramp-signal>%{T1} <label-connected>
label-connected = %local_ip%
label-connected-underline = ${colors.secondary}
label-disconnected = %{T3}󰤮%{T1} %{F#cfb793}Disconnected
